<div class="modal fade" id="invoiceUploadModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-1">Upload Service Invoice</h5>
          <small class="text-muted">
            Plate: <span id="iuPlate"></span> · VIN: <span id="iuVin"></span>
          </small>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <!-- File upload row — always visible -->
        <div class="row g-2 align-items-end">
          <div class="col">
            <label class="form-label small mb-1">Tesla service invoice (PDF)</label>
            <input type="file" class="form-control form-control-sm" id="iuFile" accept=".pdf">
          </div>
          <div class="col-auto">
            <button class="btn btn-outline-primary btn-sm" id="iuParseBtn">Parse</button>
          </div>
        </div>

        <!-- Status line -->
        <div id="iuStatus" class="mt-2 small"></div>

        <!-- Review / edit form — hidden until parse succeeds -->
        <div id="iuReview" class="d-none mt-3">

          <!-- VIN comparison -->
          <div class="p-2 border rounded bg-light small mb-3">
            <div>Vehicle VIN: <span id="iuVehicleVin" class="fw-semibold font-monospace"></span></div>
            <div>Invoice VIN: <span id="iuInvoiceVin" class="fw-semibold font-monospace"></span></div>
            <div id="iuVinWarning" class="d-none text-warning fw-semibold mt-1">
              ⚠ VIN does not match the selected vehicle. Verify before saving.
            </div>
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label small mb-1">Invoice Date</label>
              <input type="date" class="form-control form-control-sm" id="iuDate">
            </div>
            <div class="col-md-6">
              <label class="form-label small mb-1">Total Amount</label>
              <input type="number" class="form-control form-control-sm" id="iuAmount" step="0.01">
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label small mb-1">Category</label>
            <select class="form-select form-select-sm" id="iuCostCategory">
              <option value="" disabled selected>Choose...</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label small mb-1">Notes</label>
            <textarea class="form-control form-control-sm" id="iuNotes" rows="4"></textarea>
          </div>

          <button class="btn btn-success w-100" id="iuSaveBtn">Save Cost</button>

        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
      </div>

    </div>
  </div>
</div>
